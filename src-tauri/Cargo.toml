[package]
name = "oneclick"
version = "0.1.0"
description = "One-click desktop dashboard for Supabase, Git, dev servers, editors, AI CLIs and cURL"
edition = "2021"

[lib]
name = "oneclick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
